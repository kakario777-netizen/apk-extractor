name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build
        env: { BUILD_NUM: '${{ github.run_number }}' }
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log || { grep -E "error|What went wrong" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk APK추출-v1.0.${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: APK 추출 v1.0.${{ github.run_number }}
          files: APK추출-v1.0.${{ github.run_number }}.apk
